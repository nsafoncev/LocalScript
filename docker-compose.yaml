services:
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=qwen2.5-coder:7b
      - CLARIFIER_MODEL=qwen2.5:1.5b
      - REFINER_MODEL=qwen2.5:1.5b
      - CODER_MODEL=qwen2.5-coder:7b
      - CRITIC_MODEL=qwen2.5-coder:7b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama:
    image: ollama/ollama
    gpus: all
    ports:
      - "11434:11434"
    environment:
      - MODEL_NAME=qwen2.5-coder:7b
      - FAST_MODEL_NAME=qwen2.5:1.5b
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/ollama-ready ] && ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 10s

volumes:
  ollama_data:
